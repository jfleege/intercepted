name: Check projected player watch
on:
  push:
    branches: [codex/projected-player-watch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          npm run lint
          npm test
          npm run build
          npm install --no-save --package-lock=false --no-audit --no-fund playwright
      - name: Browser checks
        working-directory: frontend
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          npx vite preview --host 127.0.0.1 --port 4174 >/tmp/watch-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/intercepted/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/player-watch.browser.mjs
          node tests/unified.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-watch-preview
          path: frontend/qa/
          retention-days: 14
