name: Check matchup research models
on:
  push:
    branches: [codex/matchup-projection-models]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model dependencies
        run: python -m pip install -r requirements-automation.txt
      - name: Verify chronological features and existing behavior
        run: python -m unittest discover -s tests -v
      - uses: actions/cache@v4
        with:
          path: data/raw/research
          key: research-check-${{ runner.os }}-${{ hashFiles('src/ml/projection_features.py') }}
          restore-keys: research-check-${{ runner.os }}-
      - name: Rebuild and evaluate models from source
        run: python -m src.ml.refresh_research --force
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          npm run lint
          npm test
          npm run build
          npm install --no-save --package-lock=false --no-audit --no-fund playwright
      - name: Check report in browser
        working-directory: frontend
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          npx vite preview --host 127.0.0.1 --port 4174 >/tmp/research-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/intercepted/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/research.browser.mjs
          node tests/unified.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-models-and-preview
          path: |
            models/research/
            docs/research-validation.json
            frontend/qa/
          retention-days: 14
