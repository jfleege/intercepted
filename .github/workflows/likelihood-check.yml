name: Check player presentation and forecast transparency
on:
  push:
    branches: [codex/markets-decision, codex/player-polish-updates, codex/usage-thresholds-plans]
permissions:
  contents: read
jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate cutoff, evidence, review gates, and refresh costs
        run: |
          python -m pip install -r requirements-automation.txt pyyaml
          python -m unittest discover -s tests -v
          python scripts/check_refresh_schedule.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          npm run lint
          npm test
          npm run build
          npm install --no-save --package-lock=false --no-audit --no-fund playwright @axe-core/playwright
      - name: Check new context and existing research interactions
        working-directory: frontend
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          npx vite preview --host 127.0.0.1 --port 4174 >/tmp/insights-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/intercepted/ >/dev/null; then break; fi
            sleep 1
          done
          failed=0
          for check in player-extensions forecast-insights playbook unified interface-polish players-page markets-builder prop-quotes performance-hub footer-info; do
            node --experimental-strip-types "tests/$check.browser.mjs" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-presentation-validation
          path: frontend/qa/
          retention-days: 14
