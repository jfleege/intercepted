name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - frontend/public/predictions.json
      - data/inputs/qb_starters.json
      - src/ml/refresh_markets.py
      - src/ml/weekly_forecast.py
      - src/ml/refresh_status.py
      - src/ml/export_prediction_history.py
      - src/ml/projection_features.py
      - src/ml/projection_models.py
      - src/ml/refresh_research.py
      - src/ml/research_performance.py
      - src/features/quarter_trends.py
      - models/model_metadata.json
      - frontend/src/**
      - frontend/public/brand/**
      - frontend/public/favicon.svg
      - frontend/public/favicon.ico
      - frontend/index.html
      - src/ml/refresh_props.py
      - src/ml/odds_client.py
      - src/ml/export_odds.py
      - src/features/player_intelligence.py
  schedule:
    # 13:17 UTC = 8:17am CDT / 7:17am CST
    - cron: "17 13 * * *"
    # results after overnight games; no additional odds call
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      refresh_forecasts:
        description: Check and generate the next weekly slate with fresh stats
        type: boolean
        default: false
      paper_game:
        description: Optional custom paper selection game ID (existing fresh quote)
        type: string
        default: ""
      paper_team:
        description: Team abbreviation for custom paper selection
        type: string
        default: ""
      paper_model:
        type: choice
        description: Custom paper model
        options: [v5_qb_plus, v5_boosted, v4_a, v4_qb_plus]
        default: v4_qb_plus
      paper_stake:
        description: Paper units for custom selection
        type: string
        default: "1"
      results_only:
        description: Refresh archived forecasts and results only (no player or odds fetch)
        type: boolean
        default: false
      refresh_props:
        description: Fetch uncached player props (64-credit slate cap, 100-credit reserve)
        type: boolean
        default: false
      refresh_odds:
        description: Refresh odds (normally 3 API credits)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-refresh
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install player data dependencies
        run: python -m pip install -r requirements-automation.txt
      - name: Start refresh status record
        env:
          STATUS_MODE: ${{ (inputs.results_only == true || (github.event_name == 'schedule' && github.event.schedule == '47 7 * * *')) && 'results' || 'full' }}
        run: python -m src.ml.refresh_status start --mode "$STATUS_MODE"
      - name: Verify results grading
        id: verify
        run: python -m unittest discover -s tests -v
      - name: Advance weekly forecasts when the prior slate is complete
        id: forecast
        if: inputs.results_only != true && ((github.event_name == 'schedule' && github.event.schedule == '17 13 * * *') || inputs.refresh_forecasts || github.event_name == 'push')
        run: python -m src.ml.weekly_forecast
      - name: Archive forecasts and refresh final results
        id: results
        run: python -m src.ml.refresh_performance --import-git-history
      - name: Export browsable prediction weeks
        id: history
        run: python -m src.ml.export_prediction_history
      - name: Refresh player cards
        id: players
        if: inputs.results_only != true
        run: python -m src.features.player_watch
      - uses: actions/cache@v4
        if: inputs.results_only != true
        with:
          path: data/raw/research
          key: research-sources-${{ runner.os }}-${{ hashFiles('src/ml/projection_features.py', 'src/ml/refresh_research.py') }}
          restore-keys: research-sources-${{ runner.os }}-
      - name: Refresh experimental matchup projections and period trends
        id: research
        if: inputs.results_only != true
        continue-on-error: true
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python -m src.ml.refresh_research
      - name: Export team efficiency and ranking movement
        id: teams
        if: inputs.results_only != true
        continue-on-error: true
        run: python -m src.ml.export_team_insights
      - name: Export player directory, history and usage
        id: directory
        continue-on-error: true
        if: inputs.results_only != true
        run: python -m src.features.player_intelligence
      - name: Grade original research forecasts
        id: research_results
        continue-on-error: true
        run: python -m src.ml.research_performance
      - name: Refresh odds
        id: odds
        if: inputs.results_only != true && ((github.event_name == 'schedule' && github.event.schedule == '17 13 * * *') || inputs.refresh_odds)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::warning::ODDS_API_KEY is missing; keeping committed odds snapshot."
          else
            python -m src.ml.export_odds
          fi
      - name: Cache player prop quotes within the free-plan budget
        id: props
        if: inputs.results_only != true && ((github.event_name == 'schedule' && github.event.schedule == '17 13 * * *') || inputs.refresh_props)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          REFRESH_PROPS_NOW: ${{ inputs.refresh_props && '1' || '0' }}
        run: |
          if [ "$REFRESH_PROPS_NOW" = "1" ]; then
            python -m src.ml.refresh_props --now
          else
            python -m src.ml.refresh_props
          fi
      - name: Persist quota reservations and cached prop prices before building
        if: always() && steps.props.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/player_props.json frontend/public/odds_usage.json data/tracking/prop_refresh_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Cache player prop quotes and API quota usage"
            git push origin HEAD:main
          fi
      - name: Archive moneylines and grade paper selections
        id: markets
        env:
          PAPER_GAME: ${{ inputs.paper_game }}
          PAPER_TEAM: ${{ inputs.paper_team }}
          PAPER_MODEL: ${{ inputs.paper_model || 'v4_qb_plus' }}
          PAPER_STAKE: ${{ inputs.paper_stake || '1' }}
        run: |
          if [ -n "$PAPER_GAME" ]; then
            python -m src.ml.refresh_markets --record-paper "$PAPER_GAME" "$PAPER_TEAM" --model "$PAPER_MODEL" --stake "$PAPER_STAKE"
          else
            python -m src.ml.refresh_markets
          fi
      - name: Export refresh status and source timestamps
        if: always()
        env:
          REFRESH_OUTCOMES: >-
            {"verify":"${{ steps.verify.outcome }}","forecast":"${{ steps.forecast.outcome }}","results":"${{ steps.results.outcome }}","history":"${{ steps.history.outcome }}","players":"${{ steps.players.outcome }}","research":"${{ steps.research.outcome }}","teams":"${{ steps.teams.outcome }}","directory":"${{ steps.directory.outcome }}","research_results":"${{ steps.research_results.outcome }}","odds":"${{ steps.odds.outcome }}","props":"${{ steps.props.outcome }}","markets":"${{ steps.markets.outcome }}"}
        run: python -m src.ml.refresh_status finish
      - name: Persist refresh status evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/refresh_status.json
          if [ -f data/tracking/forecast_refresh_status.json ]; then
            git add data/tracking/forecast_refresh_status.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record refresh status and data freshness"
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Persist forecast archive and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/research_performance.json frontend/public/team_insights data/tracking frontend/public/predictions frontend/public/prediction_weeks.json frontend/public/performance.json frontend/public/predictions.json frontend/public/markets.json frontend/public/odds.json frontend/public/odds_usage.json frontend/public/player_props.json frontend/public/players_watch.json frontend/public/player_intelligence.json frontend/public/matchup_research.json frontend/public/research models/research docs/research-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh weekly forecasts, markets, and game results"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

