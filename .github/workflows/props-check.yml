name: Check cached player prop quotes
on:
  push:
    branches: [codex/cached-player-prop-quotes]
permissions:
  contents: read
jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source pipelines and credit guards
        run: |
          python -m pip install -r requirements-automation.txt
          python -m unittest discover -s tests -v
      - name: Read current quota without requesting odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m src.ml.odds_client --status
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          npm run lint
          npm test
          npm run build
          npm install --no-save --package-lock=false --no-audit --no-fund playwright
      - name: Browser checks
        working-directory: frontend
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          npx vite preview --host 127.0.0.1 --port 4174 >/tmp/props-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/intercepted/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/prop-quotes.browser.mjs
          node tests/markets-builder.browser.mjs
          node tests/unified.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cached-prop-preview
          path: |
            frontend/qa/
            frontend/public/odds_usage.json
          retention-days: 14
