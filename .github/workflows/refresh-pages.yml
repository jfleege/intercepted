name: Refresh data and deploy Pages

on:
  schedule:
    # 13:17 UTC = 8:17am CDT / 7:17am CST
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      refresh_odds:
        description: Refresh odds (normally 3 API credits)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-refresh
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install player data dependencies
        run: python -m pip install nflreadpy
      - name: Refresh player cards
        run: python -m src.features.player_watch
      - name: Refresh odds
        if: github.event_name == 'schedule' || inputs.refresh_odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::warning::ODDS_API_KEY is missing; keeping committed odds snapshot."
          else
            python -m src.ml.export_odds
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

