name: Check Tuesday noon archive and refresh
on:
  push:
    branches: [codex/tuesday-noon-refresh]
permissions:
  contents: read
jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check schedule routing, archives, and DST boundaries without API calls
        run: |
          python -m pip install -r requirements-automation.txt PyYAML
          python scripts/check_refresh_schedule.py
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate status display
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          npm run lint
          npm test
          npm run build
