name: Check dashboard layouts
on:
  push:
    branches: [codex/dashboard-scorecards, codex/unified-dashboard, codex/smooth-dashboard-motion, codex/compact-controls-player-context]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          npm run lint
          npm test
          npm run build
      - name: Prepare browser checks
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright
          if command -v google-chrome >/dev/null; then
            printf 'CHROME_BIN=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Check dashboard in browser
        working-directory: frontend
        run: |
          npx vite preview --host 127.0.0.1 --port 4174 >/tmp/dashboard-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/intercepted/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/dashboard.browser.mjs
          node tests/unified.browser.mjs
          node tests/motion.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-preview
          path: frontend/qa/
          retention-days: 14
