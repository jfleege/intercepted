name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - frontend/public/predictions.json
  schedule:
    # 13:17 UTC = 8:17am CDT / 7:17am CST
    - cron: "17 13 * * *"
    # results after overnight games; no additional odds call
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      results_only:
        description: Refresh archived forecasts and results only (no player or odds fetch)
        type: boolean
        default: false
      refresh_odds:
        description: Refresh odds (normally 3 API credits)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-refresh
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install player data dependencies
        run: python -m pip install nflreadpy==0.1.5
      - name: Verify results grading
        run: python -m unittest discover -s tests -v
      - name: Archive forecasts and refresh final results
        run: python -m src.ml.refresh_performance --import-git-history
      - name: Refresh player cards
        if: inputs.results_only != true
        run: python -m src.features.player_watch
      - name: Refresh odds
        if: inputs.results_only != true && ((github.event_name == 'schedule' && github.event.schedule == '17 13 * * *') || inputs.refresh_odds)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::warning::ODDS_API_KEY is missing; keeping committed odds snapshot."
          else
            python -m src.ml.export_odds
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Persist forecast archive and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracking frontend/public/performance.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh archived forecasts and game results"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

